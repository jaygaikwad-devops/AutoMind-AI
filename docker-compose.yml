services:
  postgres:
    image: postgres:16-alpine
    container_name: automind-postgres
    environment:
      POSTGRES_USER: automind
      POSTGRES_PASSWORD: automind
      POSTGRES_DB: automind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automind"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: automind-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      network: host
    container_name: automind-backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes: ["./backend:/app"]
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      network: host
    container_name: automind-worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes: ["./backend:/app"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host
    container_name: automind-frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
