# ============================================================
#   AutoMind AI — Nginx Configuration (HTTP Only)
#   Domain: automindai.info
#   Frontend: http://localhost:3000
#   Backend API: http://localhost:8000
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name automindai.info www.automindai.info;

    access_log /var/log/nginx/automindai.access.log;
    error_log  /var/log/nginx/automindai.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    client_max_body_size 50M;

    # ── Frontend → localhost:3000 ──
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Backend API → localhost:8000 ──
    location /api/ {
        proxy_pass         http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Swagger Docs → localhost:8000/docs ──
    location /docs {
        proxy_pass         http://localhost:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass         http://localhost:8000/openapi.json;
        proxy_set_header   Host              $host;
    }
}
